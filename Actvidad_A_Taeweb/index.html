<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buzón de quejas y sugerencias</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
<header>
    <h1>Búzon de quejas y sugerencias</h1>
</header>
    
    <section>

    <form action="/formulario" method="POST">
        <label for="nombre">Nombre Completo:</label><br>
        <input type="text" id="nombre" name="nombre" required><br><br>

        <label for="correo">Correo Electrónico:</label><br>
        <input type="email" id="correo" name="correo" required><br><br>

        <label for="telefono">Teléfono:</label><br>
        <input type="tel" id="telefono" name="telefono" required><br><br>

        <label for="fecha">Fecha del incidente:</label><br>
        <input type="date" id="fecha" name="fecha" required><br><br>

        <label for="direccion">Dirección:</label><br>
        <input type="text" id="direccion" name="direccion" required><br><br>

        <label for="especialidad">Especialidad Médica:</label><br>
        <select id="especialidad" name="especialidad">
            <option value="cardiologia">Cardiología</option>
            <option value="dermatologia">Dermatología</option>
            <option value="ginecologia">Ginecología</option>
            <option value="pediatria">Pediatría</option>
            <option value="traumatologia">Traumatología</option>
            <option value="neurologia">Neurología</option>
            <option value="odontologia">Odontología</option>
            <option value="oftalmologia">Oftalmología</option>
            <option value="medicina_general">Medicina General</option>
            <option value="otorrinolaringologia">Otorrinolaringología</option>
        </select><br><br>

        <label for="mensaje">Quejas y sugerencias</label><br>
        <textarea id="mensaje" name="Escriba su situación" rows="4" cols="50"></textarea><br><br>

        <input type="submit" value="Enviar">
    </form>
</section>
    <footer>
        <p>Todos los derechos reservados</p>
    </footer>

</body>
</html>
